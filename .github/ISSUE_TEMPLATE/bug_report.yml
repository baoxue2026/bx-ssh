name: Bug report
description: Report a reproducible BX SSH defect. Do not report vulnerabilities here.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first. Security vulnerabilities and leaked secrets must be reported privately according to SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Use an application version, release tag, or commit SHA.
      placeholder: v0.2.0 or 1a2b3c4
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Defect severity
      description: Select the highest applicable impact. P0/P1 defects block a release until resolved or explicitly mitigated.
      options:
        - "P0 - Emergency: security, data loss, cannot start or upgrade"
        - "P1 - Critical: core SSH, terminal, SFTP, credentials, or update flow unavailable"
        - "P2 - Major: important defect with a workaround"
        - "P3 - Minor: low-risk experience, copy, or edge-case issue"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Connection management
        - SSH or authentication
        - Terminal
        - SFTP or file transfer
        - Settings or desktop integration
        - Update, installation, or recovery
        - Other
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - macOS technical build
        - Linux technical build
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Test environment
      description: Include OS version, architecture, app version or commit, display scale, and relevant server/client versions.
      placeholder: |
        OS: Windows 11 24H2 x64
        App: v0.1.0 / commit 1a2b3c4
        SSH server: OpenSSH 9.x on Ubuntu 24.04
        Other: 150% display scale, proxy, or special configuration
    validations:
      required: true
  - type: dropdown
    id: release-impact
    attributes:
      label: Release impact
      description: This is a triage signal; maintainers confirm the final gate decision.
      options:
        - Yes - blocks release
        - No - does not block release
        - Unknown - needs triage
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open ...
        2. Select ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or screenshots
      description: Remove credentials, private keys, hostnames, usernames, IP addresses, local paths, and terminal contents that are not required.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmation
      options:
        - label: I searched existing issues.
          required: true
        - label: This report does not contain a vulnerability, secret, private key, credential, or unredacted user data.
          required: true
