name: Package prototypes

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-24.04
            bundles: appimage,deb,rpm
            arch: x86_64
          - platform: macos
            os: macos-14
            bundles: app,dmg
            arch: x86_64
          - platform: windows
            os: windows-2025
            bundles: msi,nsis
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          libfuse2
          patchelf
          rpm

      - name: Install Windows SQLCipher build dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            choco install strawberryperl --no-progress --yes
          }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Prepare updater signing directory
        run: >-
          node -e "require('node:fs').mkdirSync(process.argv[1], { recursive: true })"
          "${{ github.workspace }}/artifacts/updater"

      - name: Generate temporary updater signing keys
        run: |
          pnpm --filter @bx-ssh/desktop tauri signer generate --ci --password "g0-ci-ephemeral" --write-keys "${{ github.workspace }}/artifacts/updater/signing.key"
          pnpm --filter @bx-ssh/desktop tauri signer generate --ci --password "g0-ci-wrong-key" --write-keys "${{ github.workspace }}/artifacts/updater/wrong.key"

      - name: Prepare updater build configuration
        run: >-
          node scripts/prepare-updater-test.mjs
          --public-key "${{ github.workspace }}/artifacts/updater/signing.key.pub"
          --output "${{ github.workspace }}/artifacts/updater/tauri.test.conf.json"
          --version "0.1.1"

      - name: Build prototype bundles and signed updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.workspace }}/artifacts/updater/signing.key
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: g0-ci-ephemeral
        run: >-
          pnpm --filter @bx-ssh/desktop tauri build
          --ci
          --ignore-version-mismatches
          --bundles "${{ matrix.bundles }}"
          --config "${{ github.workspace }}/artifacts/updater/tauri.test.conf.json"

      - name: Verify dependency lockfiles are unchanged
        run: git diff --exit-code -- Cargo.lock pnpm-lock.yaml

      - name: Generate and validate bundle-size report
        run: node scripts/report-bundle-sizes.mjs --platform "${{ matrix.platform }}"

      - name: Validate updater signatures and rejection cases
        run: >-
          cargo run --locked -p bx-update-validator --
          --bundle-dir "${{ github.workspace }}/target/release/bundle"
          --public-key "${{ github.workspace }}/artifacts/updater/signing.key.pub"
          --wrong-public-key "${{ github.workspace }}/artifacts/updater/wrong.key.pub"
          --output-dir "${{ github.workspace }}/artifacts/updater/reports"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"
          --version "0.1.1"
          --base-url "https://github.com/baoxue2026/bx-ssh/releases/download/v0.1.1/"

      - name: Upload prototype bundles and size report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bx-ssh-${{ matrix.platform }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            target/release/bundle/**/*.AppImage
            target/release/bundle/**/*.deb
            target/release/bundle/**/*.dmg
            target/release/bundle/**/*.exe
            target/release/bundle/**/*.msi
            target/release/bundle/**/*.rpm
            target/release/bundle/**/*.sig
            target/release/bundle/**/*.tar.gz
            target/release/bundle/**/*.zip
            artifacts/bundle-size/*
            artifacts/updater/reports/*
