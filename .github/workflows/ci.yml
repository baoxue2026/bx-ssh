name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-policy:
    name: QA policy
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Validate QA policy
        run: pnpm qa:check

      - name: Test QA policy validator
        run: pnpm qa:test

      - name: Validate phase-1 acceptance status
        run: pnpm acceptance:check

      - name: Test phase-1 acceptance status validator
        run: pnpm acceptance:test

      - name: Test main branch protection validator
        run: pnpm main-protection:test

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint frontend
        run: pnpm lint

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Run frontend tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build:web

      - name: Check performance controls
        run: pnpm performance:controls

      - name: Test performance report validator
        run: pnpm performance:test

      - name: Check stability controls
        run: pnpm stability:controls

      - name: Test stability report validator
        run: pnpm stability:test

  rust:
    name: Rust checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          perl
          patchelf

      - name: Install Windows SQLCipher build dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            choco install strawberryperl --no-progress --yes
          }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --workspace --all-targets

      - name: Check generated IPC bindings
        run: |
          cargo test -p bx-ssh-desktop exports_typescript_bindings -- --ignored --nocapture
          git diff --exit-code -- apps/desktop/src/ipc/bindings.ts

  openssh:
    name: OpenSSH (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 22.04 / Ed25519
            id: ubuntu-22-04-ed25519
            image: ubuntu:22.04
            host_key: ed25519
          - name: Ubuntu 22.04 / ECDSA P-256
            id: ubuntu-22-04-ecdsa-p256
            image: ubuntu:22.04
            host_key: ecdsa-p256
          - name: Ubuntu 22.04 / RSA-SHA2
            id: ubuntu-22-04-rsa-sha2
            image: ubuntu:22.04
            host_key: rsa-sha2
          - name: Ubuntu 24.04 / Ed25519
            id: ubuntu-24-04-ed25519
            image: ubuntu:24.04
            host_key: ed25519
          - name: Ubuntu 24.04 / ECDSA P-256
            id: ubuntu-24-04-ecdsa-p256
            image: ubuntu:24.04
            host_key: ecdsa-p256
          - name: Ubuntu 24.04 / RSA-SHA2
            id: ubuntu-24-04-rsa-sha2
            image: ubuntu:24.04
            host_key: rsa-sha2
          - name: Debian 12 / Ed25519
            id: debian-12-ed25519
            image: debian:12-slim
            host_key: ed25519
          - name: Debian 12 / ECDSA P-256
            id: debian-12-ecdsa-p256
            image: debian:12-slim
            host_key: ecdsa-p256
          - name: Debian 12 / RSA-SHA2
            id: debian-12-rsa-sha2
            image: debian:12-slim
            host_key: rsa-sha2
          - name: Rocky Linux 9 / Ed25519
            id: rocky-9-ed25519
            image: rockylinux:9
            host_key: ed25519
          - name: Rocky Linux 9 / ECDSA P-256
            id: rocky-9-ecdsa-p256
            image: rockylinux:9
            host_key: ecdsa-p256
          - name: Rocky Linux 9 / RSA-SHA2
            id: rocky-9-rsa-sha2
            image: rockylinux:9
            host_key: rsa-sha2
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Install cargo-nextest
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-nextest@0.9.140

      - name: Run containerized OpenSSH integration tests
        run: bash scripts/test-openssh-docker.sh "${{ matrix.image }}" "${{ matrix.id }}" "${{ matrix.host_key }}"

      - name: Publish OpenSSH test summary
        if: always()
        run: cat "artifacts/test-reports/openssh-${{ matrix.id }}.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload OpenSSH test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bx-ssh-openssh-${{ matrix.id }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/test-reports/*

  openssh-windows:
    name: OpenSSH (Windows Server 2025 / ${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ed25519
            id: windows-server-2025-ed25519
            host_key: ed25519
          - name: ECDSA P-256
            id: windows-server-2025-ecdsa-p256
            host_key: ecdsa-p256
          - name: RSA-SHA2
            id: windows-server-2025-rsa-sha2
            host_key: rsa-sha2
    runs-on: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Run Windows OpenSSH integration tests
        shell: pwsh
        run: >-
          ./scripts/test-openssh-windows.ps1
          -MatrixId "${{ matrix.id }}"
          -HostKeyAlgorithm "${{ matrix.host_key }}"
          -IncludeSftp
          -SkipSftpBenchmark
          -IncludeTenSessions

      - name: Check SFTP fallback with a single allowed subsystem
        if: matrix.host_key == 'ed25519'
        shell: pwsh
        run: >-
          ./scripts/test-openssh-windows.ps1
          -MatrixId windows-server-2025-single-subsystem
          -IncludeSftp
          -SkipSftpBenchmark
          -MaxSessionsPerConnection 1

      - name: Publish Windows OpenSSH test summary
        if: always()
        shell: pwsh
        run: Get-Content "artifacts/test-reports/openssh-${{ matrix.id }}.md" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload Windows OpenSSH test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bx-ssh-openssh-${{ matrix.id }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/test-reports/*

  e2e:
    name: Tauri E2E (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            id: ubuntu-24-04
            os: ubuntu-24.04
            viewport_width: 1180
            viewport_height: 760
            scale_factor: ""
          - name: macOS 14
            id: macos-14
            os: macos-14
            viewport_width: 1180
            viewport_height: 760
            scale_factor: ""
          - name: Windows 1280x720 / 100%
            id: windows-1280x720-100
            os: windows-2025
            viewport_width: 1280
            viewport_height: 720
            scale_factor: "1"
          - name: Windows 1366x768 / 125%
            id: windows-1366x768-125
            os: windows-2025
            viewport_width: 1366
            viewport_height: 768
            scale_factor: "1.25"
          - name: Windows 1440x900 / 150%
            id: windows-1440x900-150
            os: windows-2025
            viewport_width: 1440
            viewport_height: 900
            scale_factor: "1.5"
          - name: Windows 1440x900 / 200%
            id: windows-1440x900-200
            os: windows-2025
            viewport_width: 1440
            viewport_height: 900
            scale_factor: "2"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update && sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y
          libwebkit2gtk-4.1-dev
          libayatana-appindicator3-dev
          librsvg2-dev
          openbox
          xvfb
          perl
          patchelf

      - name: Install Windows SQLCipher build dependency
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command perl -ErrorAction SilentlyContinue)) {
            choco install strawberryperl --no-progress --yes
          }
          "C:\Strawberry\perl\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Ensure Linux D-Bus session helper
        if: runner.os == 'Linux'
        run: |
          if ! command -v dbus-run-session >/dev/null 2>&1; then
            sudo env DEBIAN_FRONTEND=noninteractive apt-get update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y dbus-daemon
          fi
          command -v dbus-run-session

      - name: Build debug-only E2E application
        env:
          BX_SSH_E2E_EXPECTED_DEVICE_SCALE_FACTOR: ${{ matrix.scale_factor }}
        run: pnpm --filter @bx-ssh/desktop build:e2e

      - name: Run Tauri E2E tests on Linux
        if: runner.os == 'Linux'
        env:
          BX_SSH_E2E_MATRIX_ID: ${{ matrix.id }}
          BX_SSH_E2E_VIEWPORT_HEIGHT: ${{ matrix.viewport_height }}
          BX_SSH_E2E_VIEWPORT_WIDTH: ${{ matrix.viewport_width }}
        run: |
          dbus-run-session -- xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" bash -c '
            openbox --sm-disable >/tmp/bx-ssh-openbox.log 2>&1 &
            wm_pid=$!
            trap "kill $wm_pid 2>/dev/null || true" EXIT
            pnpm --filter @bx-ssh/desktop test:e2e
          '

      - name: Run Tauri E2E tests
        if: runner.os != 'Linux'
        env:
          BX_SSH_E2E_EXPECTED_DEVICE_SCALE_FACTOR: ${{ matrix.scale_factor }}
          BX_SSH_E2E_MATRIX_ID: ${{ matrix.id }}
          BX_SSH_E2E_VIEWPORT_HEIGHT: ${{ matrix.viewport_height }}
          BX_SSH_E2E_VIEWPORT_WIDTH: ${{ matrix.viewport_width }}
        run: pnpm --filter @bx-ssh/desktop test:e2e

      - name: Run real SSH desktop workflows on Windows
        if: matrix.id == 'windows-1280x720-100'
        shell: pwsh
        env:
          BX_SSH_E2E_MATRIX_ID: windows-real-ssh
          BX_SSH_E2E_VIEWPORT_HEIGHT: 720
          BX_SSH_E2E_VIEWPORT_WIDTH: 1280
          BX_SSH_E2E_EXPECTED_DEVICE_SCALE_FACTOR: "1"
        run: >-
          ./scripts/test-openssh-windows.ps1
          -MatrixId windows-real-ssh
          -BuildProfile debug
          -IncludeDesktopE2e

      - name: Upload Tauri E2E reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bx-ssh-e2e-${{ matrix.id }}-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 7
          path: |
            artifacts/test-reports/e2e/*
            artifacts/test-reports/openssh-windows-real-ssh.*

  release-gate:
    name: Release gate
    needs: [quality-policy, frontend, rust, openssh, openssh-windows, e2e]
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.2

      - name: Install pnpm
        run: npm install --global pnpm@10.30.3

      - name: Validate release controls
        run: pnpm release:controls

      - name: Test release report validator
        run: pnpm release:test
