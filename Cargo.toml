[workspace]
members = [
    "apps/desktop/src-tauri",
    "crates/contracts",
    "crates/persistence",
    "crates/ssh-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/baoxue2026/bx-ssh"
rust-version = "1.91"

[workspace.dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
argon2 = { version = "0.5.3", features = ["std", "zeroize"] }
bx-contracts = { path = "crates/contracts" }
bx-persistence = { path = "crates/persistence" }
bx-ssh-core = { path = "crates/ssh-core" }
getrandom = { version = "0.3.4", features = ["std"] }
keyring = "4.1.6"
rusqlite = { version = "=0.39.0", default-features = false, features = ["bundled-sqlcipher-vendored-openssl"] }
russh = { version = "0.62.5", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.3.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.0"
tauri = { version = "2.11.5" }
tauri-build = { version = "2.6.3" }
thiserror = { version = "2.0.19" }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }
webview2-com = "0.38.2"
windows = "0.61.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
